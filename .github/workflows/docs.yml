name: Docs

on:
  pull_request:
  push:
    branches: [v1.0, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Front matter, slugs, and placeholders
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Build (fails on broken links and anchors)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/v1.0'
        with:
          path: build

  # Publishes v1.0 to GitHub Pages. Requires Settings → Pages → Source: GitHub Actions.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1.0'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
